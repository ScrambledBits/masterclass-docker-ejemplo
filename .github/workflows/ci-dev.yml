name: Docker Image CI

on:
    push:
        branches: ["ci-cd"]

env:
    ENVIRONMENT: development

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Configure AWS Credentials 2
              uses: aws-actions/configure-aws-credentials@v6.0.0
              with:
                  aws-region: us-east-1
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: get caller identity2
              run: |
                  aws sts get-caller-identity

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag, and push docker image to Amazon ECR
              env:
                  REGISTRY: ${{  vars.REGISTRY_URI }}
                  REPOSITORY: ${{ vars.APP_NAME }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -f Dockerfile.optimizado .
                  docker tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:latest"
                  docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
                  docker push "$REGISTRY/$REPOSITORY:latest"
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Configure AWS Credentials 2
              uses: aws-actions/configure-aws-credentials@v6.0.0
              with:
                  aws-region: us-east-1
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: get caller identity2
              run: |
                  aws sts get-caller-identity
            - name: Download task definition
              run: |
                  aws ecs describe-task-definition --task-definition bootcamperu --query taskDefinition > task-definition.json
            - name: Deploy to Amazon ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                  task-definition: task-definition.json
                  service: bootcamperu-landing-page
                  cluster: test-bootcamperu
                  wait-for-service-stability: true
